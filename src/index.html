  <script>
    // Set the theme before Angular loads, so there's no flash of the
    // wrong theme (or wrong mobile browser-chrome color) on first paint.
    // Mirrors ThemeService's own logic — dark is the default when there's
    // no saved preference.
    (function () {
      var theme = 'dark';
      try {
        var stored = localStorage.getItem('ir-theme');
        theme = (stored === 'light' || stored === 'dark') ? stored : 'dark';
      } catch (e) {
        // localStorage unavailable — fall back to the default already set above.
      }
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#000000' : '#ffffff');
    })();
  </script>
