<div class="shot">
  @if (!errored) {
    <img [src]="src" [alt]="alt" loading="lazy" (error)="onError()" />
  } @else {
    <div class="shot__placeholder">
      <span class="shot__placeholder-mark">▢</span>
      <span class="shot__placeholder-label">Screenshot coming soon</span>
      <span class="shot__placeholder-path">{{ src }}</span>
    </div>
  }
</div>
