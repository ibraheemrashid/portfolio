<header class="nav" [class.nav--open]="menuOpen">
  <div class="nav__bar container">
    <a routerLink="/" class="nav__mark" aria-label="Home">IR</a>

    <nav class="nav__links" aria-label="Primary">
      <a routerLink="/about" routerLinkActive="is-active">About</a>
      <a routerLink="/experience" routerLinkActive="is-active">Experience</a>
      <a routerLink="/projects" routerLinkActive="is-active">Projects</a>
      <a routerLink="/certifications" routerLinkActive="is-active">Certifications</a>
      <a routerLink="/contact" routerLinkActive="is-active">Contact</a>
      <a href="Ibraheem Rashid.pdf" download class="nav__resume">Résumé</a>
      <button
        class="nav__theme-toggle"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        @if (theme() === 'dark') {
          <span aria-hidden="true">☀︎</span>
        } @else {
          <span aria-hidden="true">☾</span>
        }
      </button>
    </nav>

    <button
      class="nav__toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      aria-label="Toggle menu"
      aria-controls="mobileSheet"
    >
      <span></span><span></span><span></span>
    </button>
  </div>

  <div class="nav__sheet" id="mobileSheet">
    <a routerLink="/about" (click)="closeMenu()">About</a>
    <a routerLink="/experience" (click)="closeMenu()">Experience</a>
    <a routerLink="/projects" (click)="closeMenu()">Projects</a>
    <a routerLink="/certifications" (click)="closeMenu()">Certifications</a>
    <a routerLink="/contact" (click)="closeMenu()">Contact</a>
    <a href="Ibraheem Rashid.pdf" download (click)="closeMenu()" class="nav__sheet-resume">Download Résumé</a>
    <button type="button" class="nav__sheet-theme" (click)="toggleTheme()">
      @if (theme() === 'dark') {
        Switch to light theme
      } @else {
        Switch to dark theme
      }
    </button>
  </div>
</header>
