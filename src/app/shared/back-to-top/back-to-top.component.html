<button
  type="button"
  class="back-to-top"
  [class.back-to-top--visible]="visible()"
  (click)="scrollToTop()"
  aria-label="Back to top"
  [attr.tabindex]="visible() ? 0 : -1"
>
  <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
    <path d="M9 14V3M9 3L4 8M9 3l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>
